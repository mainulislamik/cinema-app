name: Build Cinema Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-cinema:
    name: Build Standalone Cinema Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install NPM Dependencies
        run: npm ci

      - name: Expo Prebuild (Generate Native Android Project)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Standalone Android APK via Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/cinema.apk

      - name: Upload Cinema APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinema-apk
          path: output_apk/cinema.apk
          retention-days: 7
